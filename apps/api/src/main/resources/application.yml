server:
  port: 8080

spring:
  application:
    name: struct-paper-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:structpaper;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

structpaper:
  latex:
    engine: auto
    timeout-seconds: 60
    auto-font-fallback: true
    xelatex-path: xelatex
    tectonic-path: ""
  storage:
    asset-dir: ${STRUCTPAPER_ASSET_DIR:./data/assets}
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: 30
  prepress:
    enabled: true
    ghostscript-path: ${GHOSTSCRIPT_PATH:}
    mock-fallback-enabled: true
    default-standard: PDF/X-1a:2001
    timeout-seconds: 60
    target-dpi: 300

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    vn.edu.vnu.structpaper: DEBUG
