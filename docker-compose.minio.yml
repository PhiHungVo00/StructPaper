# Optional object storage for StructPaper (document snapshots, exported Word/PDF/XML files).
#
#   docker compose -f docker-compose.minio.yml up -d
#
# Then start the API with:
#   STRUCTPAPER_STORAGE_TYPE=minio MINIO_ENDPOINT=http://localhost:9000 \
#   MINIO_ACCESS_KEY=minioadmin MINIO_SECRET_KEY=minioadmin ./gradlew bootRun
#
# Without STRUCTPAPER_STORAGE_TYPE the API stores the same files on local disk (./data/objects).
#
# NOTE: the upstream minio/minio images are no longer published on Docker Hub / quay.io, so this
# uses the frozen Bitnami build of the same MinIO server (fine for development). For production
# point MINIO_ENDPOINT at your own MinIO or any S3-compatible service.
services:
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: structpaper
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/bitnami/minio/data

volumes:
  minio-data:
