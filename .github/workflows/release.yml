name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--bundles dmg'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare Tectonic sidecar binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/web/src-tauri/bin"
          Copy-Item "bin/tectonic.exe" "apps/web/src-tauri/bin/tectonic-x86_64-pc-windows-msvc.exe" -Force

      - name: Cache Tauri NSIS dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-nsis-v3.13-v0.5.3

      - name: Setup NSIS toolchain with retry (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tauriDir = "$env:LOCALAPPDATA\tauri"
          $nsisDir = "$tauriDir\NSIS"
          New-Item -ItemType Directory -Force -Path $tauriDir | Out-Null
          
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            Write-Host "Downloading NSIS 3.13 package with retry..."
            $zipPath = "$env:TEMP\nsis-3.13.zip"
            curl.exe --retry 5 --retry-delay 5 --retry-all-errors -fSL "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip" -o $zipPath
            
            Write-Host "Extracting NSIS..."
            $extractTemp = "$env:TEMP\nsis_extracted"
            if (Test-Path $extractTemp) { Remove-Item -Recurse -Force $extractTemp }
            Expand-Archive -Path $zipPath -DestinationPath $extractTemp -Force
            
            if (Test-Path "$extractTemp\nsis-3.13") {
              Move-Item -Path "$extractTemp\nsis-3.13" -Destination $nsisDir -Force
            } else {
              Move-Item -Path $extractTemp -Destination $nsisDir -Force
            }
            Remove-Item -Force $zipPath
          }
          
          $pluginDir = "$nsisDir\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          if (-not (Test-Path "$pluginDir\nsis_tauri_utils.dll")) {
            Write-Host "Downloading nsis_tauri_utils.dll with retry..."
            curl.exe --retry 5 --retry-delay 5 --retry-all-errors -fSL "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll" -o "$pluginDir\nsis_tauri_utils.dll"
          }
          
          Write-Host "NSIS setup verified:"
          Test-Path "$nsisDir\makensis.exe"
          Test-Path "$pluginDir\nsis_tauri_utils.dll"

      - name: Prepare Tectonic sidecar binary (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tectonic
          mkdir -p apps/web/src-tauri/bin
          TECTONIC_PATH=$(which tectonic)
          cp "$TECTONIC_PATH" apps/web/src-tauri/bin/tectonic-aarch64-apple-darwin
          chmod +x apps/web/src-tauri/bin/tectonic-aarch64-apple-darwin

      - name: Build Next.js Web App for Desktop
        run: pnpm --filter @structpaper/web build:desktop

      - name: Build Desktop Application with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './apps/web'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('StructPaper {0}', github.ref_name) || 'StructPaper v1.0.0' }}
          releaseBody: |
            ## StructPaper Desktop Release ${{ github.ref_name }}
            
            Ứng dụng soạn thảo và định dạng bài báo khoa học chuẩn tạp chí, tích hợp sẵn động cơ Tectonic XeTeX chạy ngoại tuyến tốc độ cao.
            
            ### Hướng dẫn cài đặt:
            - **Windows**: Tải file `.exe` cài đặt (`StructPaper_*_x64-setup.exe`). Nếu Windows SmartScreen hiển thị cảnh báo, chọn **More info** -> **Run anyway**.
            - **macOS**: Tải file `.dmg`, mở file và kéo StructPaper vào thư mục Applications. Nếu macOS chặn mở, nhấp chuột phải vào ứng dụng chọn **Open**.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
