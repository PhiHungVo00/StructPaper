name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--bundles dmg'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare Tectonic sidecar binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/web/src-tauri/bin"
          Copy-Item "bin/tectonic.exe" "apps/web/src-tauri/bin/tectonic-x86_64-pc-windows-msvc.exe" -Force

      - name: Prepare Tectonic sidecar binary (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tectonic
          mkdir -p apps/web/src-tauri/bin
          TECTONIC_PATH=$(which tectonic)
          cp "$TECTONIC_PATH" apps/web/src-tauri/bin/tectonic-aarch64-apple-darwin
          chmod +x apps/web/src-tauri/bin/tectonic-aarch64-apple-darwin

      - name: Build Next.js Web App for Desktop
        run: pnpm --filter @structpaper/web build:desktop

      - name: Build Desktop Application with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/web'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('StructPaper {0}', github.ref_name) || 'StructPaper v1.0.0' }}
          releaseBody: |
            ## StructPaper Desktop Release ${{ github.ref_name }}
            
            Ứng dụng soạn thảo và định dạng bài báo khoa học chuẩn tạp chí, tích hợp sẵn động cơ Tectonic XeTeX chạy ngoại tuyến tốc độ cao.
            
            ### Hướng dẫn cài đặt:
            - **Windows**: Tải file `.exe` cài đặt (`StructPaper_*_x64-setup.exe`). Nếu Windows SmartScreen hiển thị cảnh báo, chọn **More info** -> **Run anyway**.
            - **macOS**: Tải file `.dmg`, mở file và kéo StructPaper vào thư mục Applications. Nếu macOS chặn mở, nhấp chuột phải vào ứng dụng chọn **Open**.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
